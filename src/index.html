<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Habit Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root>
    <div style="min-height:100vh;display:grid;place-items:center;background:#07080b;color:#9aa3b2;font-family:Segoe UI,Helvetica,Arial,sans-serif">
      <div style="text-align:center">
        <div style="width:44px;height:44px;margin:0 auto 12px;border-radius:50%;border:3px solid #2a3140;border-top-color:#3ddc97;animation:boot-spin .8s linear infinite"></div>
        Loading your habits…
      </div>
    </div>
    <style>@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
  </app-root>
</body>
</html>
